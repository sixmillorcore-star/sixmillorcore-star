<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title description">
  <title id="title">Sixmillor — tools for everyday work</title>
  <desc id="description">Sixmillor builds Windows apps, developer tools, and MCP integrations. A charcoal banner with mint typography and a subtle terminal illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B131B"/>
      <stop offset="1" stop-color="#101F28"/>
    </linearGradient>
    <linearGradient id="window" x1="1080" y1="96" x2="1510" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152A32"/>
      <stop offset="1" stop-color="#102128"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1375 218) scale(470 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8C2" stop-opacity=".065"/>
      <stop offset="1" stop-color="#67E8C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A8CEC8" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="440" fill="url(#background)"/>
  <rect width="1600" height="440" fill="url(#ambient)"/>
  <rect x="1020" width="580" height="440" fill="url(#grid)"/>
  <path d="M0 .5H1600" fill="none" stroke="#75E5C5" stroke-opacity=".24"/>
  <path d="M0 439.5H1600" fill="none" stroke="#A8CEC8" stroke-opacity=".1"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="84" y="80" width="9" height="9" rx="2" fill="#87E8CC"/>
    <text x="110" y="96" fill="#A1C3BE" font-size="26" font-weight="600" letter-spacing="3.2">TOOLS FOR EVERYDAY WORK</text>
    <text x="80" y="236" fill="#EEF7F4" font-size="112" font-weight="700" letter-spacing="-4.5">SIXMILLOR</text>
    <text x="86" y="297" fill="#AFC3C8" font-size="30" font-weight="400" letter-spacing=".25">Windows apps <tspan fill="#608B87">/</tspan> Developer tools <tspan fill="#608B87">/</tspan> MCP</text>
  </g>
  <path d="M86 347H720" fill="none" stroke="#90BEB7" stroke-opacity=".15"/>
  <path d="M86 347H174" fill="none" stroke="#86E7C9" stroke-width="2"/>

  <g fill="none" stroke="#A0D5C9">
    <rect x="1110" y="72" width="402" height="258" rx="15" stroke-opacity=".075"/>
    <rect x="1088" y="91" width="402" height="258" rx="15" stroke-opacity=".12"/>
  </g>
  <rect x="1066" y="110" width="402" height="258" rx="15" fill="#061015" opacity=".28"/>
  <rect x="1066.5" y="105.5" width="402" height="258" rx="15" fill="url(#window)" stroke="#7CB4A8" stroke-opacity=".28"/>
  <path d="M1067 155.5H1468" fill="none" stroke="#95C1B6" stroke-opacity=".14"/>
  <g fill="#8BB5AA">
    <circle cx="1092" cy="131" r="4" fill-opacity=".7"/>
    <circle cx="1110" cy="131" r="4" fill-opacity=".36"/>
    <circle cx="1128" cy="131" r="4" fill-opacity=".2"/>
  </g>
  <path d="M1408 131H1441" fill="none" stroke="#8BB5AA" stroke-opacity=".3" stroke-linecap="round"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="23">
    <text x="1092" y="202" fill="#8BE6C9">&gt; <tspan fill="#CEDFD9">build useful things</tspan></text>
  </g>
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M1096 239H1159" stroke="#72AE9E" stroke-opacity=".4"/>
    <path d="M1177 239H1373" stroke="#A4BFC0" stroke-opacity=".13"/>
    <path d="M1116 270H1231" stroke="#A4BFC0" stroke-opacity=".2"/>
    <path d="M1249 270H1415" stroke="#A4BFC0" stroke-opacity=".1"/>
    <path d="M1116 301H1303" stroke="#A4BFC0" stroke-opacity=".12"/>
  </g>
  <path d="M1092 335L1100 341L1092 347" fill="none" stroke="#80D6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1114" y="334" width="11" height="16" rx="1" fill="#8BE6C9" fill-opacity=".5"/>
</svg>